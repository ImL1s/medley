name: CI

# Product-line CI for the ImL1s fork.
# `main` stays a pristine upstream mirror (no fork workflows there).
# Feature / sync PRs target `providers`; pushes to `providers` also run CI.

on:
  push:
    branches: [providers]
  pull_request:
    branches: [providers]
  workflow_dispatch:

concurrency:
  # Push runs are release candidates keyed by commit SHA; if a later merge lands
  # while one is running, we still need the earlier SHA to reach a completed
  # verdict for release.yml's SHA-exact gate.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  # PRs and manual runs should still drop superseded attempts.
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keep every Rust lane on the repository-pinned protobuf toolchain. Ubuntu
  # ships protoc 21.12, which predates FieldOptions.debug_redact and cannot
  # compile the upstream debug-redaction fixtures.
  PROTOC: ${{ github.workspace }}/bin/protoc

jobs:
  audit-publisher:
    name: Audit publisher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate checked-in audit manifest
        run: python3 -B scripts/publish-audit-issues.py --validate-only

      - name: Run publisher unit tests
        run: python3 -B -m unittest discover -s tests -p 'test_audit_issue_publishers.py' -v

      - name: Enforce credential-safe observability
        run: python3 -B -m unittest tests.test_credential_observability_guard -v

      # The `new-test-filters` job below is the thing that notices a Rust test
      # no filter selects. These are its own tests -- without them it would be
      # an unverified checker guarding against unverified tests (#171).
      - name: Test the new-test filter guard
        run: python3 -B -m unittest tests.test_new_test_filter_guard -v

      - name: Test the PR-head CI receipt guard
        # This guard is a pre-merge local/orchestrator check; it does not run
        # as part of CI itself. CI only executes its Python unit tests.
        run: python3 -B -m unittest tests.test_pr_head_ci_run_guard -v

      - name: Guard distChannel docs against the release stamp
        run: python3 -B -m unittest tests.test_dist_channel_docs_guard -v

  installer:
    name: Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The installer is the one thing here that runs on machines unlike this
      # one, and until now nothing exercised it at all — every claim about it
      # rested on one macOS laptop. See #79.
      - name: Lint for POSIX sh
        run: |
          shellcheck -s sh install.sh
          dash -n install.sh
          dash -n tests/installer/run_cases.sh

      - name: Behaviour, with curl
        run: sh tests/installer/run_cases.sh

      # `select_downloader` prefers curl whenever it is present, so on any
      # normal machine the wget branch never runs. That is how it stayed
      # unexercised. This run hides curl.
      - name: Behaviour, with wget only
        env:
          EXCLUDE_DOWNLOADER: curl
        run: sh tests/installer/run_cases.sh

      # The fixture rewrites the GitHub hosts, so it cannot catch a mistake in
      # the real URLs — percent-encoding of `+` in a tag, say. One live install
      # covers exactly that, and nothing else does.
      #
      # Resolve the published tag with the job token. Anonymous
      # /releases/latest shares a 60 req/h/IP budget across runners (#256).
      # Pinning MEDLEY_VERSION still exercises download, checksums, extract,
      # launcher, --version, and the ~/.grok assertion. Latest-lookup itself
      # is covered by tests/installer/run_cases.sh `ok` / `no-release`.
      - name: Install the published release for real
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          home="$(mktemp -d)"
          MEDLEY_VERSION="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          HOME="$home" MEDLEY_VERSION="$MEDLEY_VERSION" sh install.sh
          HOME="$home" "$home/.medley/bin/medley" --version
          test ! -e "$home/.grok"

  sync-upstream:
    name: Sync upstream script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint sync-upstream shell scripts
        run: |
          shellcheck -s bash scripts/sync-upstream.sh
          bash -n scripts/sync-upstream.sh
          shellcheck -s sh tests/sync-upstream/run_cases.sh
          dash -n tests/sync-upstream/run_cases.sh

      - name: Behaviour, local bare remotes
        run: sh tests/sync-upstream/run_cases.sh

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  new-test-filters:
    name: New tests run somewhere
    runs-on: ubuntu-latest
    steps:
      # Full history: the check needs a merge base to find what this branch added.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # No Rust toolchain and no build: this reads the diff, not a test listing.
      # That is what makes it cheap, and it is also what makes it correct for
      # `#[cfg(target_os = ...)]` tests -- they are in the diff on every
      # platform, whereas `cargo test -- --list` omits them off their target.
      - name: Every new test matches a CI filter
        run: |
          python3 scripts/check_new_tests_are_filtered.py \
            --workflow .github/workflows/ci.yml \
            --base "origin/${{ github.base_ref || 'providers' }}"

  lint:
    name: Clippy (hot path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: clippy

      - name: Install DotSlash and verify pinned protoc
        run: |
          cargo install dotslash --version 0.5.7 --locked
          /usr/bin/env dotslash --help >/dev/null
          "$PROTOC" --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: providers-lint
          cache-targets: true

      - name: Clippy sampler / shell / tools / pager / pager-bin (all targets)
        run: |
          # Measured 2026-08-09 on providers (#275): `--all-targets` on these
          # five crates is clean after fixing the handful of test/bench lints
          # (see the PR). No `-A` allow-list — that would re-open the blind
          # spot this job is meant to close. Full-workspace clippy remains
          # too slow; we stay on the hot-path crates only.
          #
          # `xai-grok-pager-bin` is a binary crate: `--lib` never saw it, and
          # that is how `.err().expect()` lived green in CI since 5c8144e.
          cargo clippy --manifest-path crates/codegen/xai-grok-sampler/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/codegen/xai-grok-shell/Cargo.toml --all-targets -- -D warnings
          # Include the opt-in PI backend so its test-only environment lock is linted too.
          cargo clippy --manifest-path crates/codegen/xai-grok-tools/Cargo.toml --all-targets --features pi -- -D warnings
          cargo clippy --manifest-path crates/codegen/xai-grok-pager/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/codegen/xai-grok-pager-bin/Cargo.toml --all-targets -- -D warnings

  test:
    name: Tests (providers hot path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      # `ripgrep` is a runtime dependency of the grep tool, not a convenience:
      # `rg_path()` falls back to a bare `rg` on PATH when the crate is built
      # without `bundle_rg`, and a failed spawn surfaces as exit code -1 with
      # empty output. This job never needed it until the upstream sync brought
      # the `implementations::` filter that runs those tests, at which point 44
      # of them failed here and passed on a developer machine — because
      # developer machines have `rg`.
      - name: Install DotSlash and ripgrep
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          cargo install dotslash --version 0.5.7 --locked
          /usr/bin/env dotslash --help >/dev/null
          "$PROTOC" --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: providers-test
          cache-targets: true

      - name: Sampler auth / wire tests
        run: |
          cargo test --manifest-path crates/codegen/xai-grok-sampler/Cargo.toml \
            --test shared_http_wire none_auth_scheme_ -- --nocapture
          cargo test --manifest-path crates/codegen/xai-grok-sampler/Cargo.toml \
            none_scheme_ -- --nocapture
          cargo test --manifest-path crates/codegen/xai-grok-sampler/Cargo.toml \
            hostile_injector -- --nocapture
          cargo test --manifest-path crates/codegen/xai-grok-sampler/Cargo.toml \
            omits_xai_identity -- --nocapture

      - name: Credential relation and telemetry export guards
        run: |
          run_nonzero() {
            local output
            output="$(mktemp)"
            cargo test "$@" 2>&1 | tee "$output"
            local status="${PIPESTATUS[0]}"
            if [ "$status" -ne 0 ]; then rm -f "$output"; return "$status"; fi
            if grep -qE '^test result: ok\. 0 passed' "$output"; then
              echo "::error::filter matched zero tests: cargo test $*"
              rm -f "$output"; return 1
            fi
            rm -f "$output"
          }
          run_nonzero -p xai-grok-auth --features middleware --lib credential -- --nocapture
          run_nonzero -p xai-grok-telemetry --lib unified_log -- --nocapture
          # #121: for_test is the single place that names SamplingConfig fork
          # fields. Unique substrings — run_nonzero only fails on *zero* matches.
          run_nonzero -p xai-grok-sampling-types --lib \
            sampling_config_for_test_sets_fork_endpoint_trust_to_none -- --nocapture
          run_nonzero -p xai-grok-sampling-types --lib \
            sampling_config_for_test_fru_inherits_fork_endpoint_trust_without_naming_it -- --nocapture
          # #245: 400 body preview is secret-free and bounded; unique names.
          run_nonzero -p xai-grok-sampling-types --lib \
            provider_error_body_preview_is_secret_free_and_bounded -- --nocapture
          run_nonzero -p xai-grok-sampling-types --lib \
            provider_error_body_preview_is_empty_for_anything_unstructured -- --nocapture
          run_nonzero -p xai-grok-sampling-types --lib \
            user_facing_400_surfaces_structured_rejected_field -- --nocapture
          run_nonzero -p xai-grok-sampling-types --lib \
            codex_wire_capabilities_omit_reasoning_summary_when_unsupported -- --nocapture
          run_nonzero -p xai-grok-sampling-types --lib \
            codex_wire_capabilities_keep_summary_when_catalog_allows_or_is_silent -- --nocapture
          # #263: the catalog parser and the single chat-state mutation must
          # both run; xai-chat-state previously had no CI filter (#280).
          run_nonzero -p xai-grok-shell --lib \
            codex_catalog_parser_reads_and_validates_truncation_policy -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            tool_result_truncation_policy_catalog_refresh_ -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            trusted_reminder_suffix_ -- --nocapture
          run_nonzero -p xai-chat-state --lib \
            tool_result_truncation_policy -- --nocapture
          run_nonzero -p xai-grok-sampler --lib \
            final_relation_observes_hostile_injector_replacement_and_removal -- --nocapture
          run_nonzero -p xai-grok-sampler --lib \
            post_capture_is_immune_to_resolver_rotation_after_build -- --nocapture
          run_nonzero -p xai-grok-sampler --lib \
            sampler_request_logs_never_emit_credential_bytes -- --nocapture
          run_nonzero -p xai-grok-sampler --lib \
            transport_failure_never_emits_query_credential_bytes -- --nocapture
          run_nonzero -p xai-grok-sampler --lib \
            provider_controlled_stream_error_is_secret_free_for_all_stream_apis -- --nocapture
          # #304: Codex sometimes omits answer-span annotations. This proves
          # authoritative streamed items survive partial terminal output.
          run_nonzero -p xai-grok-tools --lib \
            codex_web_search_reconciles_partial_terminal_output_for_both_entry_points -- --nocapture
          run_nonzero -p xai-grok-mcp --lib \
            callback_errors_never_echo_provider_controlled_credentials -- --nocapture
          # #151: an unlabelled chat-state credential reaching an external origin
          # on `Unknown(CatalogUnavailable)`. Closed in code by #136, and the two
          # tests that pin it matched no filter at all -- so the highest-stakes
          # property in this fork was defended by tests no job ran (#171).
          #
          # Deliberately in this step rather than the auth one above: that step
          # uses bare `cargo test`, where a filter matching zero tests exits 0.
          # For a security property "the filter stopped matching" and "the
          # property still holds" must not look the same, and only `run_nonzero`
          # tells them apart.
          run_nonzero -p xai-grok-shell --lib catalog_unavailable -- --nocapture
          run_nonzero -p xai-grok-shell --lib test_catalog_auth_schemes_and_override -- --nocapture
          # #329: keyless local mock fixtures stay ready; start() stays Bearer.
          run_nonzero -p xai-grok-test-support --lib \
            keyless_local_server_catalog_emits_auth_scheme_none -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            keyless_local_mock_catalog_entry_is_ready_on_loopback -- --nocapture
          # #132: the reader's dup must not be inherited by children. Named
          # explicitly rather than by a `pty_session` prefix: the rest of that
          # module is the hang this change fixes, and this one is the fd leak
          # the fix introduced.
          run_nonzero -p xai-grok-shell --lib \
            dup_fd_is_not_inherited_by_exec_child -- --nocapture
          # #13: env-key normalization. In this step rather than the auth one
          # above because one of these asserts diagnostics carry the normalized
          # *name* and never a value -- and that step uses bare `cargo test`,
          # where a filter matching zero tests exits 0. `env_keys_` selects all
          # seven new tests and their three existing siblings.
          run_nonzero -p xai-grok-shell --lib env_keys_ -- --nocapture
          # #73: strict-storage hardening. One guard proves strict reads stay on
          # the already-open inode, one proves strict writes fail closed on a
          # post-rename owner-only permission assertion failure.
          run_nonzero -p xai-grok-shell --lib \
            strict_read_uses_open_file_handle_when_path_is_swapped_after_open -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            strict_atomic_write_fails_when_post_rename_permission_assertion_fails -- --nocapture
          # #56: trusted project [models]/[model.*] precedence + untrusted
          # hostile-model boundary (no credential/env-key/origin injection).
          run_nonzero -p xai-grok-shell --lib \
            project_model_overlay_precedence_merges_global_repo_and_subdir_sections -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            project_model_overlay_untrusted_repo_cannot_introduce_or_redirect_credentials -- --nocapture
          run_nonzero -p xai-grok-mcp --lib \
            callback_payload_debug_never_emits_code_state_or_issuer -- --nocapture
          run_nonzero -p xai-file-utils --lib \
            final_401_relation_uses_final_wire_credential_and_post_response_snapshot -- --nocapture
          run_nonzero -p xai-file-utils --lib \
            upload_config_debug_redacts_all_secret_carriers -- --nocapture

      - name: Provider docs examples and fixtures
        run: |
          run_nonzero() {
            local output
            output="$(mktemp)"
            cargo test "$@" 2>&1 | tee "$output"
            local status="${PIPESTATUS[0]}"
            if [ "$status" -ne 0 ]; then rm -f "$output"; return "$status"; fi
            if grep -qE '^test result: ok\. 0 passed' "$output"; then
              echo "::error::filter matched zero tests: cargo test $*"
              rm -f "$output"; return 1
            fi
            rm -f "$output"
          }
          # #31: validate executable provider docs. Unique filters so
          # run_nonzero proves each docs guard still runs after refactors.
          run_nonzero -p xai-grok-shell --lib \
            docs_examples_extractor_handles_markers_ignores_unmarked_and_rejects_malformed -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            docs_examples_parse_and_resolve_provider_toml_examples -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            docs_examples_enforce_readiness_and_secret_policy -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            docs_examples_validate_offline_commands_and_links -- --nocapture

      - name: Update channel isolation guards
        # The fork's worst failure mode is a medley binary self-updating into
        # upstream's release channel and replacing itself with the official CLI
        # (issue #71). The release workflow trusts this job, and it only checks
        # that the distribution marker is present in the shipped binary — these
        # are what prove the marker actually stops an update.
        run: |
          run_nonzero() {
            local output
            output="$(mktemp)"
            cargo test "$@" 2>&1 | tee "$output"
            local status="${PIPESTATUS[0]}"
            if [ "$status" -ne 0 ]; then rm -f "$output"; return "$status"; fi
            if grep -qE '^test result: ok\. 0 passed' "$output"; then
              echo "::error::filter matched zero tests: cargo test $*"
              rm -f "$output"; return 1
            fi
            rm -f "$output"
          }
          run_nonzero -p xai-grok-update --lib dist_channel -- --nocapture
          run_nonzero -p xai-grok-update --lib self_update -- --nocapture
          run_nonzero -p xai-grok-update --test test_dist_channel_gate -- --nocapture

      - name: Leader lock identity (Linux-only /proc probe)
        # The leader auto-kill path proves "is this OUR process" by checking
        # that the PID holds an open descriptor on the lock file (issue #158).
        # The safety half — never evict a process we cannot prove is ours — is
        # a pure unit test that runs everywhere. The POSITIVE half needs
        # /proc/<pid>/fd, so it is #[cfg(target_os = "linux")] and cannot run
        # on the macOS machines this project is developed on. Without this
        # step it would run nowhere at all, and "eviction can now fire" would
        # ship with zero executions of the test proving it can.
        #
        # run_nonzero fails on a zero-match filter, so this also catches the
        # test later being renamed, moved, or cfg'd out — the exact way it
        # silently stopped being covered before.
        run: |
          run_nonzero() {
            local output
            output="$(mktemp)"
            cargo test "$@" 2>&1 | tee "$output"
            local status="${PIPESTATUS[0]}"
            if [ "$status" -ne 0 ]; then rm -f "$output"; return "$status"; fi
            if grep -qE '^test result: ok\. 0 passed' "$output"; then
              echo "::error::filter matched zero tests: cargo test $*"
              rm -f "$output"; return 1
            fi
            rm -f "$output"
          }
          run_nonzero -p xai-grok-shell --lib holder_has_lock_file_open -- --nocapture

      - name: Restricted subagent capability boundaries
        run: |
          run_nonzero() {
            local output
            output="$(mktemp)"
            cargo test "$@" 2>&1 | tee "$output"
            local status="${PIPESTATUS[0]}"
            if [ "$status" -ne 0 ]; then rm -f "$output"; return "$status"; fi
            if grep -qE '^test result: ok\. 0 passed' "$output"; then
              echo "::error::filter matched zero tests: cargo test $*"
              rm -f "$output"; return 1
            fi
            rm -f "$output"
          }
          run_nonzero -p xai-grok-tools --lib \
            restricted_capability_matrix_finalizes_and_dispatches_with_one_policy -- --nocapture
          run_nonzero -p xai-grok-tools --lib \
            readonly_gateway_target_rejects_unclassified_and_external_mutation -- --nocapture
          run_nonzero -p xai-grok-tools --lib \
            issue39_deploy_app_requires_all_capability_mode -- --nocapture
          # #181: a route that declares its own Authorization must keep it when
          # an ambient bearer becomes available mid-session. Named in full --
          # the property is about the *transition*, and a prefix that also
          # matched the steady-state cases would go green on those alone.
          run_nonzero -p xai-grok-tools --lib \
            first_party_declared_authorization_header_survives_mid_session_login -- --nocapture
          run_nonzero -p xai-grok-tools --lib \
            tool_result_truncation_policy_runner_records_trusted_suffix_provenance -- --nocapture
          run_nonzero -p xai-grok-tools --lib \
            structured_completion_reminders_carry_every_producer_id -- --nocapture
          run_nonzero -p xai-grok-tools --lib \
            tool_result_truncation_policy_proxy_ -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            restricted_gateway_snapshot_exposes_only_trusted_permitted_tools_per_session -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            restricted_children_reject_agent_owned_mcp_servers_before_session_spawn -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            issue39_cleanup_rejected_spawn_worktree_removes_only_fresh_worktrees -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            issue39_harness_rejection_cleans_fresh_worktree_before_handoff -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            issue39_pre_handoff_guard_cleans_worktree_on_panic -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            issue14_spawn_refresh_replaces_stale_parent_capabilities -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            issue14_spawn_refresh_parent_actor_unavailable_is_actionable_error -- --nocapture
          run_nonzero -p xai-chat-state --lib \
            prepared_model_state_never_tears_routing_from_credentials -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            keeps_endpoint_and_bound_secret_when_name_collides_with_an_external_model -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            attach_restore_unique_route_ignores_reused_key_endpoint_and_secret -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            attach_restore_blocks_exact_key_reuse_and_unique_route_ambiguity -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            empty_catalog_keeps_persisted_identity_pending_instead_of_rejecting_load -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            prompt_recovery_rejects_a_remapped_model_with_an_incompatible_harness -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            identity_backed_prompt_recovery_requires_persisted_harness_evidence -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            cold_spawn_reconciled_route_rejects_incompatible_harness -- --nocapture
          # #300: an inherited Codex child resumes the already-admitted tuple;
          # durable legacy lineage is reconciled before migration, route/harness
          # drift still fails closed, and fresh overrides still preflight.
          run_nonzero -p xai-grok-subagent-resolution --lib \
            resume::tests -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            resume_model_lineage_tests -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            durable_legacy_resume_ -- --nocapture
          run_nonzero -p xai-grok-tools --lib \
            completed_resume_source_carries_committed_model_lineage -- --nocapture
          run_nonzero -p xai-grok-tools --lib \
            pre_promotion_failure_does_not_mask_durable_resume_fallback -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            issue39_verbatim_fork_tools_intersect_session_admission -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            issue39_rebuild_respects_capability_mode_ceiling -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            explicit_gateway_cache_invalidation_waits_for_all_session_admissions -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            issue39_gateway_invalidation_includes_registered_child_sessions -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
            issue39_aborted_explicit_gateway_refresh_recovers_waiters -- --nocapture
          run_nonzero -p xai-grok-shell --lib \
