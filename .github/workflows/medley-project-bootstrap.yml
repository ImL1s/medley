name: Medley Project bootstrap (ephemeral)

on:
  push:
    branches:
      - automation/medley-project-247-20260808

permissions:
  contents: write
  issues: write

concurrency:
  group: medley-project-bootstrap-247
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create project through one-time encrypted PAT handoff
        shell: bash
        env:
          AUTOMATION_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: "247"
          EXPECTED_LOGIN: "ImL1s"
        run: |
          set -euo pipefail
          set +x
          umask 077
          export GH_TOKEN="$AUTOMATION_TOKEN"

          cleanup_files() {
            rm -f /tmp/medley-project-private.pem /tmp/medley-project-public.pem               /tmp/medley-project-token.enc /tmp/medley-project-token.txt               /tmp/medley-project-setup.py /tmp/medley-project-setup.py.gz               /tmp/medley-project-setup.b64
          }
          trap cleanup_files EXIT

          nonce="$(openssl rand -hex 20)"
          marker="<!-- medley-project-bootstrap-key:${nonce} -->"
          envelope_marker="<!-- medley-project-bootstrap-envelope:${nonce} -->"

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096             -out /tmp/medley-project-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/medley-project-private.pem -pubout             -out /tmp/medley-project-public.pem >/dev/null 2>&1
          public_key_b64="$(base64 -w0 /tmp/medley-project-public.pem)"

          request_body="$(jq -rn --arg marker "$marker" --arg nonce "$nonce"             --arg public_key "$public_key_b64"             '$marker + "\nNonce: `" + $nonce + "`\nPublic key (base64 PEM):\n`" + $public_key + "`\n\nThis key is ephemeral and valid only while this workflow run is waiting."')"
          request_comment_json="$(gh api -X POST             "repos/$REPO/issues/$ISSUE_NUMBER/comments" -f body="$request_body")"
          request_comment_id="$(jq -r '.id' <<<"$request_comment_json")"

          envelope_comment_id=""
          encrypted_token_b64=""
          for _ in $(seq 1 40); do
            comments="$(gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments?per_page=100")"
            match="$(jq -r --arg login "$EXPECTED_LOGIN" --arg marker "$envelope_marker"               '.[] | select(.user.login == $login) | select(.body | startswith($marker + "\n")) | [.id, (.body | split("\n")[1])] | @tsv'               <<<"$comments" | tail -n 1)"
            if [[ -n "$match" ]]; then
              envelope_comment_id="${match%%$'\t'*}"
              encrypted_token_b64="${match#*$'\t'}"
              break
            fi
            sleep 15
          done

          if [[ -z "$envelope_comment_id" || -z "$encrypted_token_b64" ]]; then
            gh api -X POST "repos/$REPO/issues/$ISSUE_NUMBER/comments"               -f body="Project bootstrap timed out waiting for the encrypted token envelope." >/dev/null
            exit 1
          fi

          printf '%s' "$encrypted_token_b64" | base64 -d             > /tmp/medley-project-token.enc 2>/dev/null || {
              gh api -X POST "repos/$REPO/issues/$ISSUE_NUMBER/comments"                 -f body="Project bootstrap received an invalid encrypted envelope." >/dev/null
              exit 1
            }
          openssl pkeyutl -decrypt -inkey /tmp/medley-project-private.pem             -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256             -in /tmp/medley-project-token.enc -out /tmp/medley-project-token.txt             2>/dev/null || {
              gh api -X POST "repos/$REPO/issues/$ISSUE_NUMBER/comments"                 -f body="Project bootstrap could not decrypt the one-time token envelope." >/dev/null
              exit 1
            }

          project_token="$(tr -d '\r\n' < /tmp/medley-project-token.txt)"
          case "$project_token" in
            ghp_*|github_pat_*) ;;
            *)
              gh api -X POST "repos/$REPO/issues/$ISSUE_NUMBER/comments"                 -f body="Project bootstrap decrypted a value that is not a recognized GitHub PAT." >/dev/null
              exit 1
              ;;
          esac

          cat > /tmp/medley-project-setup.b64 <<'MEDLEY_SETUP_B64'
