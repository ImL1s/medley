          gzip -d -c /tmp/medley-project-setup.py.gz > /tmp/medley-project-setup.py
          python3 -m py_compile /tmp/medley-project-setup.py

          set +e
          GH_TOKEN="$project_token" python3 /tmp/medley-project-setup.py             > /tmp/medley-project-setup.out 2> /tmp/medley-project-setup.err
          setup_status=$?
          set -e

          if [[ $setup_status -ne 0 ]]; then
            safe_error="$(tail -n 30 /tmp/medley-project-setup.err | sed "s/$project_token/[REDACTED]/g")"
            failure_body="$(jq -rn --arg error "$safe_error"               '"Project bootstrap failed while calling GitHub Projects v2.\n\n```text\n" + $error + "\n```"')"
            GH_TOKEN="$AUTOMATION_TOKEN" gh api -X POST               "repos/$REPO/issues/$ISSUE_NUMBER/comments" -f body="$failure_body" >/dev/null
            exit "$setup_status"
          fi

          project_url="$(grep -E '^https://github.com/users/ImL1s/projects/[0-9]+$'             /tmp/medley-project-setup.out | tail -n 1)"
          [[ -n "$project_url" ]] || project_url="https://github.com/users/ImL1s/projects"
          success_body="$(jq -rn --arg url "$project_url"             '"Medley Product Roadmap has been created and seeded: " + $url + "\n\nConfigured: linked repository, Status/Workstream/Phase/Platform fields, initial issue portfolio, field values, native sub-issue relationships, and initial status update. Saved views and built-in Project workflows remain the UI-only checklist in #247."')"
          GH_TOKEN="$AUTOMATION_TOKEN" gh api -X POST             "repos/$REPO/issues/$ISSUE_NUMBER/comments" -f body="$success_body" >/dev/null

          GH_TOKEN="$AUTOMATION_TOKEN" gh api -X DELETE             "repos/$REPO/issues/comments/$envelope_comment_id" >/dev/null 2>&1 || true
          GH_TOKEN="$AUTOMATION_TOKEN" gh api -X DELETE             "repos/$REPO/issues/comments/$request_comment_id" >/dev/null 2>&1 || true
          GH_TOKEN="$AUTOMATION_TOKEN" gh api -X DELETE             "repos/$REPO/git/refs/heads/${{ github.ref_name }}" >/dev/null 2>&1 || true
