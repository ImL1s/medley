name: Release

# Tagged releases for the "medley" distribution of this fork (issue #29).
#
# Releases are cut from `providers`; `main` is a pristine upstream mirror and
# never carries fork tags (see FORK.md).
#
# The published command is `medley`. The cargo bin target stays
# `xai-grok-pager` — renaming it would churn every upstream sync (issue #49
# non-goal), so the rename happens here, at the packaging layer, and again in
# `install.sh` when the symlink is created.
#
# Every third-party action is pinned to a full commit SHA (issue #30); the
# version tag in the trailing comment is documentation only.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Version tag to package for a dry run. Nothing is published: the
          archives and checksums are attached to the workflow run instead.
        required: false
        default: v0.0.0+providers.0

permissions:
  contents: read

concurrency:
  # A half-uploaded release is worse than a queued one, so never cancel.
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # `[profile.release] incremental = true` is a local-dev convenience in
  # Cargo.toml. Incremental artifacts are not reproducible, so releases opt out.
  CARGO_INCREMENTAL: "0"
  # What cargo builds, versus what users end up running.
  CARGO_PACKAGE: xai-grok-pager-bin
  CARGO_BIN: xai-grok-pager
  DIST_NAME: medley
  # The oldest glibc the published Linux archives are allowed to require. Set by
  # the runner image the Linux targets build on (ubuntu-22.04 ships 2.35), and
  # asserted per build so the promise in the README and the release notes cannot
  # drift away from what shipped.
  LINUX_GLIBC_FLOOR: "2.35"
  # Matches the version `bin/protoc` pins for local development, so release
  # builds and developer builds run the same code generator.
  PROTOC_VERSION: "29.3"

jobs:
  meta:
    name: Resolve release identity
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - name: Derive tag, version, and publish mode
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
            publish=true
          else
            tag="${INPUT_TAG:-v0.0.0+providers.0}"
            publish=false
          fi

          # FORK.md pins releases to v{upstream}+providers.N. A bare upstream
          # tag like v1.2.3 would produce archives and an embedded version
          # indistinguishable from an official build, which is the confusion
          # this fork's release identity exists to prevent.
          scheme_error() {
            echo "::error::release tags must follow the fork scheme in FORK.md — v<upstream>+providers.<N>, for example v1.2.3+providers.1 (got '${tag}'). A bare upstream tag would produce artifacts indistinguishable from an official release."
            exit 1
          }

          case "$tag" in
            v?*+providers.*) ;;
            *) scheme_error ;;
          esac

          upstream="${tag%%+providers.*}"
          counter="${tag##*+providers.}"
          case "$upstream" in
            v?*) ;;
            *) scheme_error ;;
          esac
          case "$counter" in
            '' | *[!0-9]*) scheme_error ;;
          esac

          version="${tag#v}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release identity"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Tag | \`${tag}\` |"
            echo "| Version | \`${version}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Publishes a release | \`${publish}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: Pre-release gate
    needs: meta
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # read the CI verdict for the release commit
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Committed lockfile resolves without changes
        # Releases build with --locked; catch a stale Cargo.lock in seconds
        # rather than after a 40-minute matrix build.
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: CI must be green for the release commit
        # Skipped for a dry run, and only for a dry run. The gate exists so
        # published artifacts are only built from commits CI has passed; a
        # dispatch publishes nothing, attaching its archives to the workflow
        # run instead.
        #
        # Requiring it of a dispatch made the dry run useless for the thing it
        # is most needed for. A workflow change lives on a branch, a branch
        # cannot have a `push`-to-`providers` CI run for its own SHA, so
        # dry-running a change to *this file* always died here — leaving
        # "merge and find out" as the only way to test the release pipeline.
        #
        # The lockfile and formatting checks above still run, so a dispatch
        # still catches the cheap failures.
        if: needs.meta.outputs.publish == 'true'
        # The full suite already ran when this commit landed on `providers`;
        # re-running it would add ~30 minutes to every release. Reuse that
        # verdict, but only a *completed, successful* run of this repository's
        # own ci.yml, triggered by a push of `providers`, at exactly this SHA.
        #
        # Every other case fails the release: no run at all, a run still in
        # progress, a pull_request run (which tests the merge commit, not this
        # one), or some other workflow that merely calls itself "CI". Matching
        # on `.path` rather than `.name` is what makes the last one impossible.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          successful="$(gh api \
            "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${COMMIT}&event=push&branch=providers&per_page=100" \
            --jq '[.workflow_runs[]
                   | select(.head_sha == env.COMMIT
                            and .event == "push"
                            and .head_branch == "providers"
                            and .path == ".github/workflows/ci.yml"
                            and .status == "completed"
                            and .conclusion == "success")]
                  | length')"

          if [ "${successful:-0}" -lt 1 ]; then
            echo "::error::No completed, successful run of .github/workflows/ci.yml exists for ${COMMIT} (push to providers). Release artifacts are only built from commits CI has already passed — land the commit on providers, let CI finish green, then tag it."
            exit 1
          fi
          echo "Found ${successful} successful CI run(s) for ${COMMIT}."

  build:
    name: Build ${{ matrix.target }}
    needs: [meta, gate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # One native runner per target: nothing is cross-compiled, so every
          # artifact is executed on the architecture it ships to before it is
          # packaged. protoc is pinned per platform by SHA-256 (the three Linux
          # and macOS-arm64 digests are the ones already committed in
          # `bin/protoc`; the macOS-x86_64 digest is the same upstream release).
          #
          # Three fields exist only to keep the Linux lanes apart (issue #82):
          #
          #   libc          `gnu` or `musl` on Linux, empty on macOS. The glibc
          #                 floor step forks on this, because the gnu probe
          #                 reads the highest `GLIBC_` symbol and a static musl
          #                 artifact has none — it would fail for the absence
          #                 of the thing that proves it correct.
          #   host_triple   what rustc reports on the runner. Equal to `target`
          #                 everywhere except a musl lane, where a glibc host
          #                 builds a musl target of the same architecture.
          #   cargo_target  passed to `cargo build --target` when non-empty.
          #                 Empty for the four lanes that build for their host,
          #                 so their command line is unchanged; the musl lanes
          #                 must name the triple to pick up the rustflags
          #                 `.cargo/config.toml` already carries for them.
          - target: aarch64-apple-darwin
            runner: macos-15
            libc: ''
            host_triple: aarch64-apple-darwin
            cargo_target: ''
            protoc_asset: osx-aarch_64
            protoc_sha256: 2b8a3403cd097f95f3ba656e14b76c732b6b26d7f183330b11e36ef2bc028765
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            libc: ''
            host_triple: x86_64-apple-darwin
            cargo_target: ''
            protoc_asset: osx-x86_64
            protoc_sha256: 9a788036d8f9854f7b03c305df4777cf0e54e5b081e25bf15252da87e0e90875
          # Built on 22.04, not 24.04. A dynamically linked glibc binary runs
          # only where glibc is at least as new as the one it was built
          # against, and 24.04 ships 2.39 — which excludes Ubuntu 22.04 LTS
          # (2.35), Debian 12 (2.36), and RHEL/Rocky 9 (2.34). The failure is
          # not graceful: the archive downloads, its checksum verifies, the
          # installer reports success, and the binary then dies on
          # `GLIBC_2.38 not found`. Building on the older image lowers the
          # floor to cover those distributions. The step after the build
          # measures the floor that actually resulted.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            libc: gnu
            host_triple: x86_64-unknown-linux-gnu
            cargo_target: ''
            protoc_asset: linux-x86_64
            protoc_sha256: 3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            libc: gnu
            host_triple: aarch64-unknown-linux-gnu
            cargo_target: ''
            protoc_asset: linux-aarch_64
            protoc_sha256: 6427349140e01f06e049e707a58709a4f221ae73ab9a0425bc4a00c8d0e1ab32
          # Static musl archives, added *alongside* the glibc pair rather than
          # replacing it (issue #82). The gnu archives serve the majority well
          # — real NSS, real locale semantics — and the floor step keeps
          # governing them. What they cannot do is run below glibc 2.35 or on a
          # distribution with no glibc at all, where the failure is the worst
          # kind: the archive downloads, the checksum verifies, the installer
          # reports success, and the binary then dies on a missing symbol or a
          # missing loader. A container-built glibc artifact would only move
          # that line to 2.34; a static binary retires the problem, and covers
          # Alpine in the same move.
          #
          # This tree had already pre-paid most of the cost before the decision
          # was taken: `.cargo/config.toml` carries the rustflags and jemalloc
          # page size for both musl triples, jemalloc (not musl's allocator) is
          # the shipped global allocator, TLS is rustls with no `openssl-sys`
          # in the graph, and voice/ALSA is target-gated away from musl.
          #
          # Still native runners: a musl binary for the runner's own
          # architecture runs on that runner, so every archive is still
          # executed before it is packaged.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            libc: musl
            host_triple: x86_64-unknown-linux-gnu
            cargo_target: x86_64-unknown-linux-musl
            protoc_asset: linux-x86_64
            protoc_sha256: 3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
            libc: musl
            host_triple: aarch64-unknown-linux-gnu
            cargo_target: aarch64-unknown-linux-musl
            protoc_asset: linux-aarch_64
            protoc_sha256: 6427349140e01f06e049e707a58709a4f221ae73ab9a0425bc4a00c8d0e1ab32
    steps:
      - name: Check out the release commit
        # Pinned to the resolved commit, never a moving branch: artifacts must
        # come from the tagged tree even if `providers` advances mid-release.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Runner architecture matches the target triple
        # Runner images get retired and relabelled. If a label ever resolves to
        # a different architecture, fail here rather than shipping an archive
        # whose name lies about what is inside it.
        #
        # A musl lane is the one place where the runner's host triple is not
        # the packaged triple — ubuntu-22.04 is a glibc host building a musl
        # target — so the expected host comes from the matrix rather than being
        # assumed equal to `target`. The architecture is still asserted against
        # `target` itself, which is the half a relabelled runner would break;
        # dropping that and comparing only against `host_triple` would let both
        # sides of the comparison move together and prove nothing.
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_HOST: ${{ matrix.host_triple }}
        run: |
          set -euo pipefail
          host="$(rustc -vV | awk '/^host: /{print $2}')"
          if [ "$host" != "$EXPECTED_HOST" ]; then
            echo "::error::runner '${RUNNER_NAME}' has host triple '${host}' but this job expects to build on '${EXPECTED_HOST}' while packaging '${TARGET}'"
            exit 1
          fi
          if [ "${host%%-*}" != "${TARGET%%-*}" ]; then
            echo "::error::runner '${RUNNER_NAME}' is a '${host%%-*}' machine but this job packages '${TARGET}'; the archive name would lie about what is inside it"
            exit 1
          fi
          echo "Host triple: ${host}; packaging ${TARGET}"

      - name: Install the musl toolchain
        if: matrix.libc == 'musl'
        # The runner is a glibc host, so the musl std has to be added to rustup
        # and a musl C compiler installed for the two C dependencies that reach
        # a release build: jemalloc — the shipped global allocator, which is
        # why "musl's allocator is slow" does not apply to this binary — and
        # aws-lc-sys, which rustls uses and which builds through cmake.
        #
        # Nothing in `.cargo/config.toml` needs to change: it already carries
        # the hardening rustflags for both musl triples and jemalloc's musl
        # page-size and background-thread settings.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools musl-dev cmake
          rustup target add "$TARGET"

          # cc-rs looks up the compiler as CC_<triple>, with dashes replaced by
          # underscores and the triple left lower-case; aws-lc-sys hands the
          # same compiler to cmake as CMAKE_C_COMPILER. Without this both would
          # compile against the host's glibc headers. TARGET_CC is cc-rs's
          # triple-independent fallback and applies to target artifacts only,
          # so host build scripts keep using the system compiler.
          cc_var="CC_$(printf '%s' "$TARGET" | tr '-' '_')"
          {
            echo "${cc_var}=musl-gcc"
            echo "TARGET_CC=musl-gcc"
          } >> "$GITHUB_ENV"
          echo "Set ${cc_var}=musl-gcc"
          musl-gcc --version | head -n 1

      - name: Install pinned protoc
        env:
          ASSET: ${{ matrix.protoc_asset }}
          EXPECTED_SHA256: ${{ matrix.protoc_sha256 }}
        run: |
          set -euo pipefail
          zip="protoc-${PROTOC_VERSION}-${ASSET}.zip"
          url="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${zip}"
          workdir="${RUNNER_TEMP}/protoc"
          mkdir -p "$workdir"

          curl --fail --silent --show-error --location --retry 3 \
            --output "${workdir}/${zip}" "$url"

          if [ "$RUNNER_OS" = "Linux" ]; then
            actual="$(sha256sum "${workdir}/${zip}" | cut -d' ' -f1)"
          else
            actual="$(shasum -a 256 "${workdir}/${zip}" | cut -d' ' -f1)"
          fi
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::${zip} has SHA-256 ${actual}, expected ${EXPECTED_SHA256}"
            exit 1
          fi

          unzip -q -o "${workdir}/${zip}" -d "$workdir"
          chmod +x "${workdir}/bin/protoc"
          echo "PROTOC=${workdir}/bin/protoc" >> "$GITHUB_ENV"
          "${workdir}/bin/protoc" --version

      - name: Use a portable baseline for aarch64 Linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        # `.cargo/config.toml` builds this target with `-C target-cpu=neoverse-v2`,
        # which suits a known fleet but emits instructions that fault on older
        # arm64 CPUs (Graviton2 and Ampere Altra are Neoverse N1). An archive
        # published under the bare `aarch64-unknown-linux-gnu` triple has to run
        # across that whole triple, so distribution builds drop the microarch pin.
        #
        # This has to be RUSTFLAGS rather than CARGO_TARGET_<TRIPLE>_RUSTFLAGS:
        # cargo treats the latter as one more config source and *joins* it with
        # `target.<triple>.rustflags`, so the microarch pin survives. RUSTFLAGS
        # sits above config in cargo's mutually-exclusive precedence list and
        # replaces it outright — which is also why force-unwind-tables
        # (backtraces) has to be restated here. The next step proves it worked.
        run: |
          set -euo pipefail
          echo 'RUSTFLAGS=-C force-unwind-tables=yes' >> "$GITHUB_ENV"

      - name: Verify the effective rustc flags
        # Compiling one cheap leaf crate with -v shows the exact rustc command
        # cargo will use for the real build. Asserting on it means a change to
        # .cargo/config.toml, or to how cargo resolves flag precedence, fails
        # the release instead of silently shipping a binary pinned to a
        # microarchitecture most of the triple does not have.
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_TRIPLE: ${{ matrix.cargo_target }}
          LIBC: ${{ matrix.libc }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/rustflags-probe.log"
          # The probe has to compile for the triple that ships, or it reads the
          # flags of a target nobody is building: on a musl lane an untargeted
          # build resolves `.cargo/config.toml` against the runner's *gnu*
          # host and every assertion below would be about the wrong artifact.
          if [ -n "$CARGO_TARGET_TRIPLE" ]; then
            CARGO_TARGET_DIR="${RUNNER_TEMP}/rustflags-probe" \
              cargo build --release --locked --target "$CARGO_TARGET_TRIPLE" -p xai-grok-version -v > "$log" 2>&1
          else
            CARGO_TARGET_DIR="${RUNNER_TEMP}/rustflags-probe" \
              cargo build --release --locked -p xai-grok-version -v > "$log" 2>&1
          fi

          if ! grep -q 'Running.*rustc' "$log"; then
            echo "::error::the probe compiled nothing, so the assertions below would be vacuous"
            exit 1
          fi
          if grep -q 'target-cpu=neoverse-v2' "$log"; then
            echo "::error::rustc still receives -C target-cpu=neoverse-v2 for ${TARGET}; the published binary would fault on Neoverse N1 hardware"
            exit 1
          fi
          if ! grep -q 'force-unwind-tables=yes' "$log"; then
            echo "::error::force-unwind-tables=yes was lost for ${TARGET}; release backtraces would be degraded"
            exit 1
          fi
          # The musl triples are the only ones `.cargo/config.toml` hardens
          # with full RELRO and a non-executable stack. Losing those silently
          # would ship a weaker binary that still passes every other check.
          if [ "$LIBC" = musl ] && ! grep -q 'relro' "$log"; then
            echo "::error::the RELRO / noexecstack link args .cargo/config.toml sets for ${TARGET} did not reach rustc"
            exit 1
          fi
          echo "Effective flags verified for ${TARGET}: no microarch pin, unwind tables intact."

      - name: Build the release binary
        env:
          # Consumed by crates/codegen/xai-grok-pager/build.rs, which bakes
          # "<version> (<short sha>)" into `medley --version`.
          GROK_VERSION: ${{ needs.meta.outputs.version }}
          # Consumed by crates/codegen/xai-grok-version/build.rs, which bakes
          # the distribution identity in. Without it the binary cannot prove
          # which release channel it belongs to and refuses to self-update
          # (issue #71). It refuses either way — the marker is what turns a
          # blank "unverified build" refusal into medley's upgrade instructions.
          MEDLEY_CHANNEL: medley
          CARGO_TARGET_TRIPLE: ${{ matrix.cargo_target }}
        run: |
          set -euo pipefail
          # `--target` moves the output under target/<triple>/, so the path is
          # published here rather than recomputed by each later step. The four
          # lanes that build for their own host keep the untargeted command
          # line they have always used — passing --target there would stop
          # RUSTFLAGS reaching build scripts, which on macOS is where the
          # dynamic-lookup link args are needed.
          if [ -n "$CARGO_TARGET_TRIPLE" ]; then
            cargo build --release --locked --target "$CARGO_TARGET_TRIPLE" --package "$CARGO_PACKAGE" --bin "$CARGO_BIN"
            release_bin="target/${CARGO_TARGET_TRIPLE}/release/${CARGO_BIN}"
          else
            cargo build --release --locked --package "$CARGO_PACKAGE" --bin "$CARGO_BIN"
            release_bin="target/release/${CARGO_BIN}"
          fi

          if [ ! -x "$release_bin" ]; then
            echo "::error::the build reported success but produced no executable at ${release_bin}"
            exit 1
          fi
          echo "RELEASE_BIN=${release_bin}" >> "$GITHUB_ENV"
          echo "Built ${release_bin}"

      - name: Measure the glibc floor
        # Forked by artifact kind rather than branched inside one probe, and
        # not optional (issue #82). This step proves an artifact correct by
        # reading the highest versioned glibc symbol out of it; a static musl
        # artifact has no such symbols, so running it there would fail on the
        # absence of the very evidence it needs. The musl step below asserts
        # the opposite property — that there is nothing to measure — and has
        # its own guard against passing for the wrong reason.
        if: matrix.libc == 'gnu'
        # The runner image decides how old a distribution can run this archive,
        # and it decides it silently: nothing about a 24.04 build looks
        # different until it reaches a user on 22.04. Read the floor out of the
        # binary and fail when it exceeds what the README and release notes
        # promise, so raising it becomes a deliberate act rather than a side
        # effect of a runner-label bump.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="${RELEASE_BIN}"

          # Versioned glibc symbols look like `GLIBC_2.34` in the dynamic
          # symbol table; the highest one is the floor. `sort -V` orders
          # 2.9 before 2.34, which a lexical sort would not.
          versions="$(objdump -T "$bin" | sed -n 's/.*GLIBC_\([0-9][0-9.]*\).*/\1/p' | sort -uV)"

          if [ -z "$versions" ]; then
            echo "::error::found no versioned glibc symbols in ${bin}; the probe cannot vouch for anything, so it must not pass silently"
            exit 1
          fi

          floor="$(printf '%s\n' "$versions" | tail -n 1)"
          echo "Highest glibc symbol required by ${TARGET}: GLIBC_${floor}"

          highest="$(printf '%s\n%s\n' "$floor" "$LINUX_GLIBC_FLOOR" | sort -V | tail -n 1)"
          if [ "$highest" != "$LINUX_GLIBC_FLOOR" ]; then
            echo "::error::${TARGET} requires GLIBC_${floor}, above the promised floor of ${LINUX_GLIBC_FLOOR}. Either build on an older runner image or update LINUX_GLIBC_FLOOR, the README, and the release notes together — users on older distributions get a checksum-verified archive that dies on 'GLIBC_${floor} not found'."
            exit 1
          fi

          {
            echo "### glibc floor — ${TARGET}"
            echo
            echo "Requires \`GLIBC_${floor}\`; promised floor is \`${LINUX_GLIBC_FLOOR}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert the musl artifact is static and glibc-free
        if: matrix.libc == 'musl'
        # The musl half of the forked floor check. A gnu artifact is judged by
        # the highest glibc version it needs; a musl artifact is judged by
        # needing no glibc at all — no interpreter to load one, no NEEDED entry
        # naming one, and no versioned `GLIBC_` token anywhere in the file.
        # Those three are what make the archive run on Debian 11 and Alpine
        # alike, and they are the whole reason this lane exists.
        #
        # Every assertion here is about something being absent, which is the
        # dangerous shape: a tool that read nothing at all would satisfy all of
        # them. So each is paired with a positive fact from the same tool over
        # the same file, and none of the checks depend on the symbol table,
        # which `strip` can remove without changing whether the binary is
        # static.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="${RELEASE_BIN}"

          if ! readelf --file-header --wide "$bin" > "${RUNNER_TEMP}/elf-header.txt" 2>&1; then
            echo "::error::readelf cannot read ${bin} as an ELF file, so nothing below would mean anything"
            cat "${RUNNER_TEMP}/elf-header.txt"
            exit 1
          fi

          # Positive control for readelf: a real executable has program
          # headers. Zero of them means the file was not parsed, not that it
          # has no interpreter.
          readelf --program-headers --wide "$bin" > "${RUNNER_TEMP}/elf-segments.txt"
          segments="$(grep -c '^  [A-Z_]\{3,\} ' "${RUNNER_TEMP}/elf-segments.txt" || true)"
          if [ "${segments:-0}" -lt 4 ]; then
            echo "::error::read only ${segments} program headers out of ${bin}; the interpreter check below would pass vacuously"
            cat "${RUNNER_TEMP}/elf-segments.txt"
            exit 1
          fi

          # A dynamically linked executable always carries a PT_INTERP naming
          # its loader. Its absence is what "static" means at load time, and it
          # holds for both plain-static and static-pie layouts.
          if grep -q 'INTERP' "${RUNNER_TEMP}/elf-segments.txt"; then
            interp="$(sed -n 's/.*Requesting program interpreter: \([^]]*\)\].*/\1/p' "${RUNNER_TEMP}/elf-segments.txt")"
            echo "::error::${TARGET} requests the dynamic loader '${interp}'. A musl archive that needs a loader is not static, and would fail on exactly the distributions this lane exists to reach."
            exit 1
          fi

          # And nothing may be left to resolve at run time.
          readelf --dynamic --wide "$bin" > "${RUNNER_TEMP}/elf-dynamic.txt" 2>&1 || true
          if grep -q '(NEEDED)' "${RUNNER_TEMP}/elf-dynamic.txt"; then
            echo "::error::${TARGET} still links against shared libraries:"
            grep '(NEEDED)' "${RUNNER_TEMP}/elf-dynamic.txt"
            exit 1
          fi

          # Positive control for the string scan: any real binary yields
          # thousands of strings. A short list means `strings` failed to read
          # the file, and "no GLIBC_ tokens" would then be an artefact of that.
          strings -a "$bin" > "${RUNNER_TEMP}/elf-strings.txt"
          string_count="$(wc -l < "${RUNNER_TEMP}/elf-strings.txt" | tr -d ' ')"
          if [ "${string_count:-0}" -lt 1000 ]; then
            echo "::error::read only ${string_count} strings out of ${bin}; the glibc-symbol check below would pass vacuously"
            exit 1
          fi

          # Versioned glibc references live in .gnu.version_r and .dynstr, both
          # of which a static binary has no reason to contain. Scanning the
          # whole file rather than a symbol table catches them wherever they
          # survive, and keeps working on a stripped artifact.
          glibc_tokens="$(grep -o 'GLIBC_[0-9][0-9.]*' "${RUNNER_TEMP}/elf-strings.txt" | sort -uV || true)"
          if [ -n "$glibc_tokens" ]; then
            echo "::error::${TARGET} carries versioned glibc references, so it is not the static artifact this lane promises:"
            printf '%s\n' "$glibc_tokens"
            exit 1
          fi

          echo "${TARGET}: static (${segments} segments, no PT_INTERP, no NEEDED), no GLIBC_ references in ${string_count} strings."

          {
            echo "### libc floor — ${TARGET}"
            echo
            echo "Static: no interpreter, no \`NEEDED\` entry, and no \`GLIBC_\` reference."
            echo "Runs below the \`${LINUX_GLIBC_FLOOR}\` floor the gnu archives promise, and on distributions with no glibc at all."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package the archive
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail

          stage="${DIST_NAME}-${VERSION}-${TARGET}"
          archive="${stage}.tar.gz"
          dist="${GITHUB_WORKSPACE}/dist"
          mkdir -p "${dist}/${stage}"

          cp "${RELEASE_BIN}" "${dist}/${stage}/${DIST_NAME}"
          chmod 755 "${dist}/${stage}/${DIST_NAME}"
          cp LICENSE "${dist}/${stage}/LICENSE"

          # NOTICE.md carries the "community fork, not affiliated with or
          # endorsed by xAI" statement and arrives with the outward-identity
          # work (#53). Warn rather than fail so release order is not coupled
          # to docs merge order.
          if [ -f NOTICE.md ]; then
            cp NOTICE.md "${dist}/${stage}/NOTICE.md"
          else
            echo "::warning::NOTICE.md is absent from this commit; ${archive} ships without the fork attribution notice"
          fi

          # Prove the binary runs on this architecture and reports the tag.
          version_output="$("${dist}/${stage}/${DIST_NAME}" --version)"
          echo "medley --version: ${version_output}"
          case "$version_output" in
            *"$VERSION"*) ;;
            *)
              echo "::error::binary reports '${version_output}', which does not contain the release version '${VERSION}'"
              exit 1
              ;;
          esac

          # Prove the distribution marker survived the build. If MEDLEY_CHANNEL
          # were dropped, the binary would still run and still refuse to
          # self-update, but its refusal would read as an unidentified build
          # instead of naming medley's installer — a silent downgrade in the
          # only guidance a stuck user gets (issue #71).
          dist_output="$("${dist}/${stage}/${DIST_NAME}" version --json)"
          echo "medley version --json: ${dist_output}"
          case "$dist_output" in
            *'"distChannel":"medley"'*) ;;
            *)
              echo "::error::binary reports ${dist_output}, which is not stamped as the medley distribution; check that MEDLEY_CHANNEL reached the build step"
              exit 1
              ;;
          esac

          # And that it was built for the triple the archive is named after.
          # `buildTarget` (issue #100) exists so a binary can answer this
          # without the repository beside it, which is what makes it the right
          # signal for gnu-versus-musl rather than a second marker invented
          # here. Two musl lanes build on glibc hosts, so a lost `--target`
          # would otherwise produce a dynamically linked binary inside an
          # archive named `...-musl.tar.gz`.
          case "$dist_output" in
            *"\"buildTarget\":\"${TARGET}\""*) ;;
            *)
              echo "::error::binary reports ${dist_output}, which was not built for ${TARGET}; the archive name would not match its contents"
              exit 1
              ;;
          esac

          # Normalise mtimes, ownership, and entry order so the archive depends
          # on its contents rather than on when the runner happened to build it.
          epoch="$(git log -1 --pretty=%ct)"
          if [ "$RUNNER_OS" = "Linux" ]; then
            stamp="$(date -u -d "@${epoch}" +%Y%m%d%H%M.%S)"
          else
            stamp="$(date -u -r "${epoch}" +%Y%m%d%H%M.%S)"
          fi
          find "${dist}/${stage}" -exec touch -t "$stamp" {} +

          if [ "$RUNNER_OS" = "Linux" ]; then
            tar --sort=name --format=ustar --owner=0 --group=0 --numeric-owner \
              -cf - -C "$dist" "$stage" | gzip -9 -n > "${dist}/${archive}"
          else
            # bsdtar has no --sort, so feed it an explicitly sorted file list.
            entries="${RUNNER_TEMP}/entries.txt"
            ( cd "$dist" && find "$stage" \( -type f -o -type l \) | LC_ALL=C sort > "$entries" )
            tar --uid 0 --gid 0 --uname '' --gname '' --format ustar \
              -cf - -C "$dist" -T "$entries" | gzip -9 -n > "${dist}/${archive}"
          fi

          rm -rf "${dist:?}/${stage}"

          if [ "$RUNNER_OS" = "Linux" ]; then
            digest="$(sha256sum "${dist}/${archive}" | cut -d' ' -f1)"
          else
            digest="$(shasum -a 256 "${dist}/${archive}" | cut -d' ' -f1)"
          fi
          printf '%s  %s\n' "$digest" "$archive" > "${dist}/${archive}.sha256"
          cat "${dist}/${archive}.sha256"

      - name: Unpack and run what users will download
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          stage="${DIST_NAME}-${VERSION}-${TARGET}"
          verify="${RUNNER_TEMP}/verify"
          mkdir -p "$verify"
          tar -xzf "${GITHUB_WORKSPACE}/dist/${stage}.tar.gz" -C "$verify"
          test -f "${verify}/${stage}/LICENSE"
          # Catches a lost executable bit, which tar preserves but a rebuilt
          # packaging step could easily drop.
          "${verify}/${stage}/${DIST_NAME}" --version

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: medley-archive-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  musl-portability:
    # The reason the musl lanes exist is a claim about machines no runner
    # image is: glibc older than the 2.35 floor, or no glibc at all. Building
    # the archive proves nothing about that, and neither does running it on the
    # 22.04 host that built it — which is why the build job's own smoke test
    # cannot stand in for this one.
    #
    # rockylinux:9 and amazonlinux:2023 are both glibc 2.34, the two
    # distributions issue #82 names by name. Nothing is installed into either
    # image: a static binary that needs a package installed first is not the
    # thing being promised.
    name: musl ${{ matrix.arch }} on ${{ matrix.image }}
    needs: [meta, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            image: rockylinux:9
          - arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            image: amazonlinux:2023
          - arch: aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            image: rockylinux:9
          - arch: aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            image: amazonlinux:2023
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the musl archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: medley-archive-${{ matrix.target }}
          path: dist

      - name: Test the bytes that were packaged
        # The smoke test is only about the published archive if it is the
        # published archive. Re-checking the digest the build job computed
        # costs nothing and rules out a transfer that quietly truncated.
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict "${DIST_NAME}-${VERSION}-${TARGET}.tar.gz.sha256"

      - name: Mint a throwaway CA for the smoke harness
        # The harness terminates TLS, so it needs a certificate medley will
        # accept. `GROK_EXTRA_CA_BUNDLE` is the fork's existing opt-in for
        # additional roots — additive to the webpki set — so no trust store
        # inside the container has to be touched, and the container keeps
        # answering the question it was chosen to answer.
        #
        # Two days of validity and a key that never leaves the runner: this
        # exists for the length of one job.
        run: |
          set -euo pipefail
          smoke="${RUNNER_TEMP}/smoke"
          mkdir -p "$smoke"
          cp tests/release/musl_smoke_server.py tests/release/musl_smoke.sh "$smoke/"

          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -sha256 \
            -keyout "${smoke}/ca.key" -out "${smoke}/ca.pem" \
            -subj '/CN=medley musl smoke CA' \
            -addext 'basicConstraints=critical,CA:TRUE,pathlen:0' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign'

          openssl req -newkey rsa:2048 -nodes -sha256 \
            -keyout "${smoke}/server.key" -out "${smoke}/server.csr" \
            -subj '/CN=medley-smoke.test'

          # rustls goes by subjectAltName and extendedKeyUsage, not the CN, so
          # a certificate without these is rejected however well-formed it
          # looks. Written with printf rather than a heredoc because the YAML
          # block indentation would end up inside the file.
          printf '%s\n' \
            'subjectAltName = DNS:medley-smoke.test' \
            'basicConstraints = critical,CA:FALSE' \
            'keyUsage = critical,digitalSignature,keyEncipherment' \
            'extendedKeyUsage = serverAuth' > "${smoke}/leaf.ext"

          openssl x509 -req -in "${smoke}/server.csr" -days 2 -sha256 \
            -CA "${smoke}/ca.pem" -CAkey "${smoke}/ca.key" -CAcreateserial \
            -extfile "${smoke}/leaf.ext" -out "${smoke}/server.pem"

          # If the chain does not verify here it will not verify inside the
          # container either, and the failure there would read as "musl cannot
          # do TLS" rather than "this job minted a bad certificate".
          openssl verify -CAfile "${smoke}/ca.pem" "${smoke}/server.pem"
          openssl x509 -in "${smoke}/server.pem" -noout -text |
            grep -A1 'Subject Alternative Name'

      - name: Run the archive in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          archive="${DIST_NAME}-${VERSION}-${TARGET}.tar.gz"
          docker run --rm \
            --volume "${RUNNER_TEMP}/smoke:/smoke:ro" \
            --volume "${GITHUB_WORKSPACE}/dist:/dist:ro" \
            --workdir /tmp \
            "$IMAGE" \
            /bin/sh /smoke/musl_smoke.sh "/dist/${archive}" "$TARGET" "$VERSION"

          {
            echo "### ${TARGET} on ${IMAGE}"
            echo
            echo "Starts, reports its build target, execs a child, resolves a name, and completes a TLS handshake."
          } >> "$GITHUB_STEP_SUMMARY"

  checksums:
    name: Aggregate checksums
    needs: [meta, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download every target archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: medley-archive-*
          merge-multiple: true
          path: dist

      - name: Build and verify the checksums file
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd dist

          checksums="${DIST_NAME}-${VERSION}-checksums.txt"
          # Each hash was computed on the runner that produced the archive, so
          # concatenating those files keeps the per-target digests authoritative
          # and re-verifies them here against the transferred bytes.
          cat ./*.tar.gz.sha256 | LC_ALL=C sort -k2 > "$checksums"
          sha256sum --check --strict "$checksums"
          # The per-archive files are kept and published alongside the
          # aggregate. Checking the aggregate requires all six archives
          # present, so a user who downloaded only their own platform would see
          # five "No such file" errors and a non-zero exit from a verification
          # that actually succeeded for the file they have.

          # Two macOS, two Linux gnu, two Linux musl. This count is the only
          # thing that notices a matrix lane that silently stopped uploading —
          # `merge-multiple` is happy with however many artifacts arrive.
          found="$(find . -name '*.tar.gz' | wc -l | tr -d ' ')"
          if [ "$found" != "6" ]; then
            echo "::error::expected 6 archives, found ${found}"
            exit 1
          fi

          {
            echo "### Artifacts"
            echo
            echo '```'
            cat "$checksums"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The dependency graph is a property of the source, not of any one
      # target, so this runs once here rather than four times in the matrix.
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: src

      - name: Generate the SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: src
          format: cyclonedx-json
          # Pinned like every other third-party input here (#30): the scanner
          # decides what the SBOM says, so its version is part of the answer.
          syft-version: v1.18.1
          output-file: dist/${{ env.DIST_NAME }}-${{ needs.meta.outputs.version }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: The SBOM must describe this release, not an empty tree
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          sbom="dist/${DIST_NAME}-${VERSION}-sbom.cdx.json"

          # An SBOM nobody checks is worse than none: it looks like evidence.
          # A scanner that finds no manifest still emits valid CycloneDX with
          # an empty component list, which would publish a supply-chain
          # attestation asserting this release has no dependencies.
          components="$(jq '.components | length' "$sbom")"
          if [ "$components" -lt 100 ]; then
            echo "::error::SBOM lists ${components} components; this workspace has far more. The scanner most likely did not find Cargo.lock."
            exit 1
          fi

          # And it has to be about *this* release.
          jq -e --arg v "$VERSION" '.metadata.component.version == $v' "$sbom" >/dev/null ||
            echo "::notice::SBOM metadata does not carry the release version; the component list is what matters and is present."

          # Published alongside the archives, so it needs a digest of its own
          # for the same reason they do.
          digest="$(sha256sum "$sbom" | cut -d' ' -f1)"
          printf '%s  %s\n' "$digest" "$(basename "$sbom")" > "${sbom}.sha256"

          {
            echo "### SBOM"
            echo
            echo "\`${components}\` components, CycloneDX JSON."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: medley-release-bundle
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish draft release
    # The portability job gates the draft rather than merely reporting: a musl
    # archive that does not run on the distributions it was added for is worse
    # than not shipping one, because the installer would start selecting it.
    needs: [meta, checksums, musl-portability]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload assets
      id-token: write # OIDC identity for provenance
      attestations: write # record the provenance attestation
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: medley-release-bundle
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.tar.gz

      - name: Compose release notes
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          upstream="unknown"
          if [ -f SOURCE_REV ]; then
            upstream="$(tr -d '[:space:]' < SOURCE_REV)"
          fi

          {
            echo "## medley ${TAG}"
            echo
            echo "Community distribution of a fork of [grok-build](https://github.com/xai-org/grok-build)."
            echo "Not affiliated with, sponsored by, or endorsed by xAI."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Fork release | \`${TAG}\` |"
            echo "| Fork commit | \`${GITHUB_SHA}\` |"
            echo "| Upstream base | \`${upstream}\` |"
            echo "| Channel | \`providers\` |"
            echo
            echo "### Changes"
            echo
            echo "_Draft: summarise the fork changes in this release before publishing._"
            echo
            echo "### Install"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/install.sh | sh"
            echo '```'
            echo
            echo "\`medley\` installs to \`~/.medley/bin\` and keeps its state in \`~/.medley\`."
            echo "An existing official \`grok\` installation is left untouched."
            echo
            echo "macOS 15+ on Apple silicon or Intel."
            echo
            echo "Linux ships two flavours per architecture, and the installer picks"
            echo "between them for you:"
            echo
            echo "| Archive | Linking | Requires |"
            echo "| --- | --- | --- |"
            echo "| \`*-unknown-linux-gnu\` | dynamic | glibc ${LINUX_GLIBC_FLOOR} or newer — Ubuntu 22.04+, Debian 12+, Fedora 36+ |"
            echo "| \`*-unknown-linux-musl\` | static | nothing |"
            echo
            echo "The musl archives carry no libc requirement at all, which covers"
            echo "RHEL/Rocky 9 and Amazon Linux 2023 (glibc 2.34), Debian 11 (2.31),"
            echo "and Alpine, where there is no glibc to be below. \`install.sh\` reads"
            echo "the host's glibc version and downloads the musl archive when it is"
            echo "under ${LINUX_GLIBC_FLOOR} or absent; set \`MEDLEY_LIBC=gnu\` or"
            echo "\`MEDLEY_LIBC=musl\` to choose yourself."
            echo
            echo "Prefer the gnu archives where they run: they use the system's NSS"
            echo "and locale support, which a static binary cannot load. The release"
            echo "job measures the glibc floor out of each gnu binary, and proves each"
            echo "musl binary needs no loader and names no glibc symbol, rather than"
            echo "shipping an archive that would not run."
            echo
            echo "### Verify"
            echo
            echo "Each archive ships its own \`.sha256\` next to it. Check that one —"
            echo "the combined \`${DIST_NAME}-${VERSION}-checksums.txt\` lists all six"
            echo "archives, so checking it reports the five you did not download as"
            echo "missing and exits non-zero."
            echo
            echo "On Linux:"
            echo
            echo '```sh'
            echo "sha256sum -c ${DIST_NAME}-${VERSION}-<target>.tar.gz.sha256"
            echo '```'
            echo
            echo "On macOS:"
            echo
            echo '```sh'
            echo "shasum -a 256 -c ${DIST_NAME}-${VERSION}-<target>.tar.gz.sha256"
            echo '```'
            echo
            echo "The release also carries a CycloneDX SBOM,"
            echo "\`${DIST_NAME}-${VERSION}-sbom.cdx.json\`, listing every crate this"
            echo "build was compiled from, with its own \`.sha256\`."
            echo
            echo "Provenance, either platform:"
            echo
            echo '```sh'
            echo "gh attestation verify ${DIST_NAME}-${VERSION}-<target>.tar.gz --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } > "${RUNNER_TEMP}/notes.md"

          cat "${RUNNER_TEMP}/notes.md"

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if existing="$(gh release view "$TAG" --repo "$REPO" --json isDraft,body 2>/dev/null)"; then
            # Re-running the job should refresh a draft it created moments ago,
            # but must never rewrite artifacts users may already have
            # downloaded and checksummed. Two conditions have to hold.
            if [ "$(printf '%s' "$existing" | jq -r '.isDraft')" != "true" ]; then
              echo "::error::Release ${TAG} is already published. Refusing to overwrite the assets of a published release — a checksum or attestation someone has already verified would silently stop matching. Delete the release manually if it really must be rebuilt."
              exit 1
            fi
            # The generated notes always carry the fork commit, so this catches
            # a stale draft left behind by a run against a different commit.
            case "$(printf '%s' "$existing" | jq -r '.body')" in
              *"$GITHUB_SHA"*) ;;
              *)
                echo "::error::Draft ${TAG} was built from a different commit than ${GITHUB_SHA}. Refusing to mix artifacts from two commits in one release; delete the stale draft and re-run."
                exit 1
                ;;
            esac

            echo "Refreshing the unpublished draft for ${TAG} at the same commit."
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$REPO" \
              --draft \
              --verify-tag \
              --title "medley ${TAG}" \
              --notes-file "${RUNNER_TEMP}/notes.md"
          fi

          url="$(gh release view "$TAG" --repo "$REPO" --json url --jq .url)"
          {
            echo "### Draft release"
            echo
            echo "${url}"
            echo
            echo "Review the notes and publish manually — the release is created as a draft on purpose."
          } >> "$GITHUB_STEP_SUMMARY"
